<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">
  <title>Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main>
    <!-- ======================= WORKOUT (interval training) ======================= -->
    <section id="view-workout" class="view active">
      <header class="bar"><h1>Workout</h1></header>
      <div class="w-scroll">
        <div class="w-summary">
          <div class="w-total"><span>Total</span><b id="wTotal">0:00</b></div>
          <div id="wShape" class="w-shape"></div>
          <div id="wStrip" class="strip"></div>
        </div>
        <div class="presets w-presets" id="wPresets"></div>
        <div class="w-rows" id="wRows"></div>
      </div>
      <div class="w-foot">
        <button id="wStart" class="w-start">
          <svg viewBox="0 0 24 24" class="ic fill"><path d="M8 5.5v13l11-6.5z"/></svg><span>Start workout</span>
        </button>
      </div>
    </section>

    <!-- ======================= TIMER ======================= -->
    <section id="view-timer" class="view">
      <!-- Running and paused timers -->
      <div id="timerList" class="pane timer-list">
        <header class="bar">
          <h1>Timer</h1>
          <button id="addBtn" class="add-btn" aria-label="Add timer">
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
          </button>
        </header>
        <div id="notifyHint" class="hint" hidden>
          <svg viewBox="0 0 24 24" class="ic"><path d="M6 16v-5a6 6 0 0 1 9.6-4.8M18 10.5V16l1.5 2H8M10 20.5a2 2 0 0 0 4 0M4 4l16 16"/></svg>
          <span>Notifications are off, so timers can't ring while the app is closed.</span>
          <button id="notifyAllow" class="pill">Allow</button>
        </div>
        <div id="cards" class="cards"></div>
      </div>

      <!-- New timer: keypad -->
      <div id="newTimer" class="pane new-timer">
        <header class="bar">
          <h1>New timer</h1>
          <button id="kpClose" class="icon-btn" aria-label="Back to timers">
            <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div class="entry" id="entry" aria-live="polite"></div>
        <input id="labelInput" class="label-input" maxlength="24" placeholder="Label (optional)" autocomplete="off" enterkeyhint="done">
        <div class="presets" id="presets"></div>
        <div class="keys" id="keys">
          <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
          <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
          <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
          <button data-d="00">00</button><button data-d="0">0</button>
          <button data-d="del" class="del" aria-label="Delete digit">
            <svg viewBox="0 0 24 24" class="ic"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
          </button>
        </div>
        <div class="kp-foot">
          <button id="kpStart" class="start-btn" aria-label="Start timer" disabled>
            <svg viewBox="0 0 24 24" class="ic fill"><path d="M8 5.5v13l11-6.5z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ======================= STOPWATCH ======================= -->
    <section id="view-sw" class="view">
      <header class="bar"><h1>Stopwatch</h1></header>
      <div class="sw-dial">
        <svg viewBox="0 0 220 220" class="ring">
          <circle class="track" cx="110" cy="110" r="100"/>
          <circle id="swArc" class="prog" cx="110" cy="110" r="100"/>
          <circle id="swDot" class="dot" cx="110" cy="10" r="7"/>
        </svg>
        <div class="dial-center">
          <div class="sw-time"><span id="swMain">00:00</span><span id="swFrac" class="frac">.00</span></div>
        </div>
      </div>
      <div class="sw-controls">
        <button id="swLeft" class="round ghost" disabled>Lap</button>
        <button id="swRight" class="round primary">Start</button>
      </div>
      <div class="laps-wrap">
        <ol id="laps" class="laps"></ol>
      </div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tabbtn active" data-tab="workout" role="tab">
      <svg viewBox="0 0 24 24" class="ic"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Workout</span><i class="badge"></i>
    </button>
    <button class="tabbtn" data-tab="timer" role="tab">
      <svg viewBox="0 0 24 24" class="ic"><path d="M6.5 3h11M6.5 21h11M8 3v2.5c0 2.6 4 4.3 4 6.5s-4 3.9-4 6.5V21M16 3v2.5c0 2.6-4 4.3-4 6.5s4 3.9 4 6.5V21"/></svg>
      <span>Timer</span><i class="badge"></i>
    </button>
    <button class="tabbtn" data-tab="sw" role="tab">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.8M9.5 2.5h5M12 2.5V6M18.2 6.8l1.6-1.6"/></svg>
      <span>Stopwatch</span><i class="badge"></i>
    </button>
  </nav>

  <!-- ======================= WORKOUT RUNNING ======================= -->
  <div id="wRun" class="w-run" hidden>
    <div class="w-top">
      <button id="wEnd" class="w-icon" aria-label="End workout">
        <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="wCount" class="w-count"></div>
      <button id="wMute" class="w-icon" aria-label="Sound on">
        <svg viewBox="0 0 24 24" class="ic on"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg viewBox="0 0 24 24" class="ic off"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
    <div id="wPhase" class="w-phase"></div>
    <div class="w-dial">
      <svg viewBox="0 0 220 220" class="ring">
        <circle class="track" cx="110" cy="110" r="100"/>
        <circle id="wArc" class="prog" cx="110" cy="110" r="100"/>
      </svg>
      <div class="dial-center">
        <div id="wTime" class="w-time">0:00</div>
        <div id="wPausedTag" class="w-paused">Paused</div>
      </div>
    </div>
    <div id="wNext" class="w-next"></div>
    <div class="w-controls">
      <button id="wBack" class="w-btn" aria-label="Back to the start of this phase">
        <svg viewBox="0 0 24 24" class="ic fill"><rect x="5" y="5.5" width="2.6" height="13" rx="1"/><path d="M19 6v12l-9.5-6z"/></svg>
      </button>
      <button id="wToggle" class="w-btn big" aria-label="Pause"></button>
      <button id="wSkip" class="w-btn" aria-label="Skip to the next phase">
        <svg viewBox="0 0 24 24" class="ic fill"><rect x="16.4" y="5.5" width="2.6" height="13" rx="1"/><path d="M5 6v12l9.5-6z"/></svg>
      </button>
    </div>
    <div class="w-bottom">
      <div class="w-left"><span>Total left</span><b id="wLeft">0:00</b></div>
      <div class="strip-box"><div id="wRunStrip" class="strip"></div><i id="wDoneShade" class="strip-shade"></i><i id="wMarker" class="strip-marker"></i></div>
    </div>

    <div id="wDone" class="w-done" hidden>
      <div class="w-done-badge">
        <svg viewBox="0 0 24 24" class="ic"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="w-done-title">Workout complete</div>
      <div id="wDoneSummary" class="w-done-summary"></div>
      <div class="w-done-actions">
        <button id="wAgain" class="pill big ghost">Again</button>
        <button id="wClose" class="pill big">Done</button>
      </div>
    </div>

    <div id="wConfirm" class="sheet-wrap" hidden>
      <div class="sheet">
        <div class="sheet-title">End this workout?</div>
        <div class="sheet-actions">
          <button id="wConfirmNo" class="pill big ghost">Keep going</button>
          <button id="wConfirmYes" class="pill big danger">End</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Colour picker for a workout phase -->
  <div id="colorSheet" class="sheet-wrap" hidden>
    <div class="sheet">
      <div id="colorTitle" class="sheet-title"></div>
      <div id="swatches" class="swatches"></div>
    </div>
  </div>

  <!-- ======================= TIME'S UP ======================= -->
  <div id="alarm" class="alarm" hidden>
    <div class="alarm-body">
      <div class="alarm-bell">
        <svg viewBox="0 0 24 24" class="ic"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
      </div>
      <div class="alarm-title">Time's up</div>
      <div id="alarmLabel" class="alarm-label"></div>
      <div id="alarmOver" class="alarm-over">-0:00</div>
      <div id="alarmMore" class="alarm-more"></div>
    </div>
    <div class="alarm-actions">
      <button id="alarmPlus" class="round ghost">+1:00</button>
      <button id="alarmStop" class="stop-btn">Stop</button>
    </div>
  </div>
</div>
<script src="js/time.js"></script>
<script src="js/app.js"></script>
</body>
</html>
